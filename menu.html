<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modify Menu</title>
  <meta name="theme-color" content="#d9480f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="css/style.css?v=16" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="dashboard.html"><span class="brand-dot"></span><span data-shop-name>Shop</span></a>
    <div class="topbar-right">
      <a class="btn btn-ghost btn-sm" href="dashboard.html">← Dashboard</a>
    </div>
  </header>

  <main class="container">
    <h1>Modify menu items</h1>

    <form class="card" id="item-form" style="margin:1rem 0 1.5rem">
      <h3 id="form-title">Add item</h3>
      <input type="hidden" id="item-id" />
      <div class="form-grid">
        <div class="field span-2">
          <label for="item-name">Name</label>
          <input class="input" id="item-name" maxlength="80" required />
        </div>
        <div class="field">
          <label for="item-cat">Category</label>
          <input class="input" id="item-cat" list="cats" maxlength="40" placeholder="General" />
          <datalist id="cats"></datalist>
        </div>
        <div class="field">
          <label for="item-price">Price</label>
          <input class="input" id="item-price" type="number" min="0" step="0.01" required />
        </div>
        <div class="field wide">
          <label for="item-img">Image URL <span class="muted">(optional)</span></label>
          <input class="input" id="item-img" type="url" maxlength="500" placeholder="https://…" />
        </div>
        <div class="field check-field">
          <label><input type="checkbox" id="item-active" checked /> Available</label>
        </div>
        <div class="form-actions">
          <button class="btn" type="submit" id="save-btn">Add</button>
          <button class="btn btn-ghost hidden" type="button" id="cancel-btn">Cancel</button>
        </div>
      </div>
    </form>

    <div class="toolbar">
      <input class="input" id="filter" placeholder="Filter items…" />
      <div class="row-actions">
        <span class="muted" id="count"></span>
        <a class="btn btn-ghost btn-sm" href="ingredients.html">Manage ingredients</a>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Category</th><th class="num">Price</th><th>Ingredients</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>

  <!-- Recipe modal -->
  <div class="modal-backdrop hidden" id="recipe-modal" role="dialog" aria-modal="true" aria-labelledby="r-title">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2 style="margin:0" id="r-title">Ingredients</h2>
          <div class="muted" style="font-size:.9rem">Quantity needed to make 1 of this item.</div>
        </div>
        <button class="icon-btn" type="button" id="r-close" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="recipe-list" id="r-list"></div>
        <button class="btn btn-ghost btn-sm" type="button" id="r-add" style="margin-top:.75rem">+ Add ingredient</button>
      </div>
      <div class="modal-foot">
        <a class="btn btn-ghost" href="ingredients.html">Manage ingredients</a>
        <button class="btn" type="button" id="r-save">Save</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js?v=16"></script>
  <script src="js/common.js?v=16"></script>
  <script src="js/notify.js?v=16"></script>
  <script src="js/shell.js?v=16"></script>
  <script>
    const { rpc, money, esc, toast } = App;
    let me, items = [], recipes = {}, ingredients = [], stock = { items: {} };
    const $ = (id) => document.getElementById(id);

    (async () => {
      try {
        me = await App.requireAdmin({ superOnly: true });
        if (me) load();
      } catch (err) {
        toast(err.message, "error");
      }
    })();

    async function load() {
      try {
        [items, recipes, ingredients, stock] = await Promise.all([
          rpc("list_menu", { p_token: me.token, p_include_inactive: true }),
          rpc("list_menu_recipes", { p_token: me.token }),
          rpc("list_ingredients", { p_token: me.token }),
          rpc("menu_stock", { p_token: me.token }),
        ]);
        render();
      } catch (err) {
        toast(err.message, "error");
      }
    }

    $("filter").addEventListener("input", render);

    function render() {
      const q = $("filter").value.trim().toLowerCase();
      const list = items.filter((i) => !q || i.name.toLowerCase().includes(q) || i.category.toLowerCase().includes(q));
      $("count").textContent = `${items.length} item(s)`;
      $("cats").innerHTML = [...new Set(items.map((i) => i.category))].map((c) => `<option value="${esc(c)}">`).join("");
      $("rows").innerHTML = list.length
        ? list
            .map(
              (i) => `<tr>
          <td><div class="name-cell">
            <div class="thumb thumb-sm" aria-hidden="true">${esc(i.name.charAt(0).toUpperCase())}${i.image_url ? `<img src="${esc(i.image_url)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>
            <strong>${esc(i.name)}</strong>
          </div></td>
          <td>${esc(i.category)}</td>
          <td class="num">${money(i.price)}</td>
          <td><button class="btn btn-ghost btn-sm" data-recipe="${i.id}">${
            (recipes[i.id] || []).length ? `${recipes[i.id].length} linked` : "+ Link"
          }</button></td>
          <td><span class="badge ${i.is_active ? "badge-paid" : ""}">${i.is_active ? "available" : "hidden"}</span>${
            (stock.items[i.id] || {}).status === "out" ? ' <span class="badge badge-cancelled">out of stock</span>'
            : (stock.items[i.id] || {}).status === "low" ? ' <span class="badge badge-pending">low stock</span>' : ""
          }</td>
          <td><div class="row-actions">
            <button class="btn btn-ghost btn-sm" data-edit="${i.id}">Edit</button>
            <button class="btn btn-danger btn-sm" data-del="${i.id}">Delete</button>
          </div></td>
        </tr>`
            )
            .join("")
        : `<tr><td colspan="6" class="empty">${items.length ? "No matching items." : "No items yet. Add your first one above."}</td></tr>`;
    }

    function resetForm() {
      $("item-form").reset();
      $("item-id").value = "";
      $("item-active").checked = true;
      $("form-title").textContent = "Add item";
      $("save-btn").textContent = "Add";
      $("cancel-btn").classList.add("hidden");
    }
    $("cancel-btn").addEventListener("click", resetForm);

    $("item-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("save-btn");
      btn.disabled = true;
      try {
        const id = $("item-id").value ? Number($("item-id").value) : null;
        await rpc("upsert_menu_item", {
          p_token: me.token,
          p_id: id,
          p_name: $("item-name").value,
          p_category: $("item-cat").value,
          p_price: Number($("item-price").value),
          p_is_active: $("item-active").checked,
          p_image_url: $("item-img").value.trim() || null,
        });
        toast(id ? "Item updated" : "Item added", "success");
        resetForm();
        load();
      } catch (err) {
        toast(err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });

    $("rows").addEventListener("click", async (e) => {
      const edit = e.target.closest("[data-edit]");
      const del = e.target.closest("[data-del]");
      const recipeBtn = e.target.closest("[data-recipe]");
      if (recipeBtn) return openRecipe(Number(recipeBtn.dataset.recipe));
      if (edit) {
        const i = items.find((x) => x.id === Number(edit.dataset.edit));
        $("item-id").value = i.id;
        $("item-name").value = i.name;
        $("item-cat").value = i.category;
        $("item-price").value = i.price;
        $("item-active").checked = i.is_active;
        $("item-img").value = i.image_url || "";
        $("form-title").textContent = `Edit “${i.name}”`;
        $("save-btn").textContent = "Save";
        $("cancel-btn").classList.remove("hidden");
        window.scrollTo({ top: 0, behavior: "smooth" });
        $("item-name").focus();
      }
      if (del) {
        const i = items.find((x) => x.id === Number(del.dataset.del));
        if (!confirm(`Delete “${i.name}”? Past bills keep their item names. Tip: untick "Available" to just hide it.`)) return;
        try {
          await rpc("delete_menu_item", { p_token: me.token, p_id: i.id });
          toast("Item deleted", "success");
          load();
        } catch (err) {
          toast(err.message, "error");
        }
      }
    });

    // ---------- Recipe (ingredients per menu item) ----------
    const recipeModal = $("recipe-modal");
    let recipeItem = null;
    let draft = []; // [{ ingredient_id, qty }]

    function openRecipe(id) {
      recipeItem = items.find((x) => x.id === id);
      draft = (recipes[id] || []).map((r) => ({ ingredient_id: r.ingredient_id, qty: r.qty }));
      if (!draft.length && ingredients.length) draft.push({ ingredient_id: null, qty: "" });
      $("r-title").textContent = `Ingredients · ${recipeItem.name}`;
      renderRecipe();
      recipeModal.classList.remove("hidden");
    }

    function closeRecipe() {
      recipeModal.classList.add("hidden");
    }

    function renderRecipe() {
      const list = $("r-list");
      $("r-add").classList.toggle("hidden", !ingredients.length);
      $("r-save").disabled = !ingredients.length;
      if (!ingredients.length) {
        list.innerHTML = `<div class="empty">No ingredients yet. <a href="ingredients.html">Add ingredients</a> first.</div>`;
        return;
      }
      if (!draft.length) {
        list.innerHTML = `<div class="empty">No ingredients linked. Click “+ Add ingredient”.</div>`;
        return;
      }
      list.innerHTML = draft
        .map((r, idx) => {
          const ing = ingredients.find((g) => g.id === r.ingredient_id);
          return `<div class="recipe-row" data-idx="${idx}">
            <select class="input" data-f="ingredient" aria-label="Ingredient">
              <option value="">Select ingredient</option>
              ${ingredients.map((g) => `<option value="${g.id}" ${g.id === r.ingredient_id ? "selected" : ""}>${esc(g.name)}</option>`).join("")}
            </select>
            <div class="qty-unit">
              <input class="input" type="number" min="0" step="0.001" inputmode="decimal" data-f="qty" value="${esc(r.qty)}" placeholder="Qty" aria-label="Quantity" />
              <span class="muted">${ing ? esc(ing.unit) : ""}</span>
            </div>
            <button class="icon-btn" type="button" data-remove="${idx}" aria-label="Remove">×</button>
          </div>`;
        })
        .join("");
    }

    $("r-list").addEventListener("input", (e) => {
      const row = e.target.closest("[data-idx]");
      if (!row) return;
      const r = draft[Number(row.dataset.idx)];
      if (e.target.dataset.f === "qty") r.qty = e.target.value;
      if (e.target.dataset.f === "ingredient") {
        r.ingredient_id = e.target.value ? Number(e.target.value) : null;
        renderRecipe();
      }
    });

    $("r-list").addEventListener("click", (e) => {
      const rm = e.target.closest("[data-remove]");
      if (!rm) return;
      draft.splice(Number(rm.dataset.remove), 1);
      renderRecipe();
    });

    $("r-add").addEventListener("click", () => {
      draft.push({ ingredient_id: null, qty: "" });
      renderRecipe();
      $("r-list").querySelector(".recipe-row:last-child select")?.focus();
    });

    $("r-save").addEventListener("click", async () => {
      const rows = draft.filter((r) => r.ingredient_id || String(r.qty).trim());
      if (rows.some((r) => !r.ingredient_id)) return toast("Select an ingredient for every row.", "error");
      if (rows.some((r) => !(Number(r.qty) > 0))) return toast("Each quantity must be greater than 0.", "error");
      const ids = rows.map((r) => r.ingredient_id);
      if (new Set(ids).size !== ids.length) return toast("Each ingredient can be added only once.", "error");

      const btn = $("r-save");
      btn.disabled = true;
      try {
        await rpc("set_menu_item_ingredients", {
          p_token: me.token,
          p_menu_item_id: recipeItem.id,
          p_items: rows.map((r) => ({ ingredient_id: r.ingredient_id, qty: Number(r.qty) })),
        });
        toast("Ingredients saved", "success");
        closeRecipe();
        load();
      } catch (err) {
        toast(err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });

    $("r-close").addEventListener("click", closeRecipe);
    recipeModal.addEventListener("click", (e) => { if (e.target === recipeModal) closeRecipe(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !recipeModal.classList.contains("hidden")) closeRecipe(); });
  </script>
</body>
</html>
