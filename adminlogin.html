<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-dot"></span><span data-shop-name>Shop</span></a>
    <div class="topbar-right"><a class="btn btn-ghost btn-sm" href="index.html">← Home</a></div>
  </header>

  <main class="auth-wrap">
    <form class="card auth-card" id="login-form" autocomplete="on">
      <h1>Admin login</h1>
      <p class="muted">Sign in to create and manage bills.</p>
      <div class="field">
        <label for="username">Username</label>
        <input class="input" id="username" name="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required />
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <p class="error-text" id="error"></p>
      <button class="btn btn-block" type="submit">Login</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js?v=4"></script>
  <script src="js/common.js?v=4"></script>
  <script>
    if (App.session.get()) location.replace("dashboard.html");

    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");

    const pwInput = document.getElementById("password");
    const pwToggle = document.getElementById("pw-toggle");
    pwToggle.addEventListener("click", () => {
      const show = pwInput.type === "password";
      pwInput.type = show ? "text" : "password";
      pwToggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
      pwToggle.setAttribute("aria-pressed", String(show));
      pwToggle.querySelector(".eye-open").classList.toggle("hidden", show);
      pwToggle.querySelector(".eye-closed").classList.toggle("hidden", !show);
      pwInput.focus();
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      const btn = form.querySelector("button");
      btn.disabled = true;
      btn.textContent = "Signing in…";
      try {
        const s = await App.rpc("admin_login", {
          p_username: document.getElementById("username").value,
          p_password: document.getElementById("password").value,
        });
        App.session.set(s);
        location.replace("dashboard.html");
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false;
        btn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
