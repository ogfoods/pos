<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="dashboard.html"><span class="brand-dot"></span><span data-shop-name>Shop</span></a>
    <div class="topbar-right">
      <span id="who" class="muted"></span>
      <button class="btn btn-ghost btn-sm" onclick="App.logout()">Logout</button>
    </div>
  </header>

  <main class="container">
    <h1 id="greeting">Dashboard</h1>
    <p class="muted" style="margin-bottom:1.5rem">What would you like to do?</p>

    <div class="bento">
      <button class="bento-card primary" id="card-new-bill" type="button">
        <div class="bento-icon">🧾</div>
        <div>
          <h2>New bill</h2>
          <p class="muted">Enter customer, pick items, collect payment.</p>
        </div>
      </button>
      <a class="bento-card super-only" href="managebills.html">
        <span class="badge lock-tag hidden">🔒 Super admin</span>
        <div class="bento-icon">📂</div>
        <div>
          <h2>Manage bills</h2>
          <p class="muted">Search, view, update or delete orders.</p>
        </div>
      </a>
      <a class="bento-card super-only" href="menu.html">
        <span class="badge lock-tag hidden">🔒 Super admin</span>
        <div class="bento-icon">🍽️</div>
        <div>
          <h2>Modify menu items</h2>
          <p class="muted">Add, edit, price and hide items.</p>
        </div>
      </a>
    </div>
  </main>

  <!-- New bill modal -->
  <div class="modal-backdrop hidden" id="bill-modal" role="dialog" aria-modal="true" aria-labelledby="bill-title">
    <div class="modal">
      <div class="modal-head">
        <h2 id="bill-title" style="margin:0">New bill</h2>
        <button class="icon-btn" type="button" id="bill-close" aria-label="Close">×</button>
      </div>

      <div class="modal-body">
        <div class="steps"><span></span><span></span><span></span></div>

        <!-- Step 1: customer -->
        <section data-step="0">
          <h3>Customer details</h3>
          <div class="field">
            <label for="c-phone">Phone number *</label>
            <input class="input" id="c-phone" type="tel" inputmode="numeric" maxlength="15" placeholder="e.g. 9876543210" />
          </div>
          <div class="field">
            <label for="c-name">Customer name <span class="muted">(optional)</span></label>
            <input class="input" id="c-name" maxlength="80" />
          </div>
        </section>

        <!-- Step 2: items -->
        <section data-step="1" class="hidden">
          <h3>Select items</h3>
          <input class="input" id="item-filter" placeholder="Filter items…" style="margin-bottom:.5rem" />
          <div class="menu-pick" id="menu-pick"></div>
          <div class="sticky-total"><span id="item-count">0 items</span><span id="cart-total">₹0.00</span></div>
        </section>

        <!-- Step 3: payment -->
        <section data-step="2" class="hidden pay">
          <h3>Payment</h3>
          <p class="muted" id="pay-for"></p>
          <div class="pay-amount" id="pay-amount"></div>
          <div class="qr-box"><div id="qr"></div></div>
          <p class="muted" style="font-size:.85rem">Sample QR — scan with any UPI app.</p>
          <ul class="order-items" id="pay-items" style="text-align:left"></ul>
        </section>
      </div>

      <div class="modal-foot">
        <button class="btn btn-ghost" type="button" id="bill-back">Back</button>
        <button class="btn" type="button" id="bill-next">Next</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    const { rpc, money, esc, digits, toast, renderItems, cfg } = App;
    let me = null;
    let menu = [];
    const cart = new Map(); // menu_item_id -> qty
    let step = 0;

    (async () => {
      try {
        me = await App.requireAdmin();
        if (!me) return;
        document.getElementById("who").innerHTML =
          `${esc(me.username)} <span class="badge ${me.role === "super" ? "badge-super" : ""}">${me.role === "super" ? "super admin" : "admin"}</span>`;
        document.getElementById("greeting").textContent = `Hi, ${me.username}`;
        if (me.role !== "super") {
          document.querySelectorAll(".super-only").forEach((c) => {
            c.classList.add("locked");
            c.removeAttribute("href");
            c.setAttribute("aria-disabled", "true");
            c.querySelector(".lock-tag").classList.remove("hidden");
            c.addEventListener("click", () => toast("Only super admin can access this.", "error"));
          });
        }
      } catch (err) {
        toast(err.message, "error");
      }
    })();

    // ---------- Modal ----------
    const modal = document.getElementById("bill-modal");
    const backBtn = document.getElementById("bill-back");
    const nextBtn = document.getElementById("bill-next");
    const phoneIn = document.getElementById("c-phone");
    const nameIn = document.getElementById("c-name");

    document.getElementById("card-new-bill").addEventListener("click", openBill);
    document.getElementById("bill-close").addEventListener("click", closeBill);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeBill(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !modal.classList.contains("hidden")) closeBill(); });

    function openBill() {
      cart.clear();
      phoneIn.value = "";
      nameIn.value = "";
      document.getElementById("item-filter").value = "";
      showStep(0);
      modal.classList.remove("hidden");
      document.body.style.overflow = "hidden";
      phoneIn.focus();
    }

    function closeBill() {
      if (cart.size && !confirm("Discard this bill?")) return;
      modal.classList.add("hidden");
      document.body.style.overflow = "";
    }

    function showStep(n) {
      step = n;
      document.querySelectorAll("[data-step]").forEach((s) => s.classList.toggle("hidden", Number(s.dataset.step) !== n));
      document.querySelectorAll(".steps span").forEach((s, i) => s.classList.toggle("active", i <= n));
      backBtn.style.visibility = n === 0 ? "hidden" : "visible";
      nextBtn.textContent = n === 2 ? "Done" : "Next";
      nextBtn.disabled = false;
    }

    backBtn.addEventListener("click", () => showStep(Math.max(0, step - 1)));
    nextBtn.addEventListener("click", async () => {
      if (step === 0) {
        const p = digits(phoneIn.value);
        if (p.length < 6 || p.length > 15) return toast("Enter a valid phone number.", "error");
        phoneIn.value = p;
        nextBtn.disabled = true;
        await loadMenu();
        showStep(1);
      } else if (step === 1) {
        if (!cart.size) return toast("Select at least one item.", "error");
        renderPayment();
        showStep(2);
      } else {
        await submitOrder();
      }
    });

    // ---------- Step 2: items ----------
    async function loadMenu() {
      try {
        menu = await rpc("list_menu", { p_token: me.token, p_include_inactive: false });
        renderMenu();
      } catch (err) {
        toast(err.message, "error");
      }
    }

    document.getElementById("item-filter").addEventListener("input", renderMenu);

    function renderMenu() {
      const box = document.getElementById("menu-pick");
      const q = document.getElementById("item-filter").value.trim().toLowerCase();
      const list = menu.filter((m) => !q || m.name.toLowerCase().includes(q) || m.category.toLowerCase().includes(q));
      if (!menu.length) {
        box.innerHTML = `<div class="empty">No menu items yet. Ask super admin to add items.</div>`;
      } else if (!list.length) {
        box.innerHTML = `<div class="empty">No matching items.</div>`;
      } else {
        let lastCat = null;
        box.innerHTML = list
          .map((m) => {
            const qty = cart.get(m.id) || 0;
            const head = m.category !== lastCat ? `<div class="menu-cat">${esc(m.category)}</div>` : "";
            lastCat = m.category;
            return `${head}
              <div class="menu-row ${qty ? "selected" : ""}">
                <div><strong>${esc(m.name)}</strong><div class="muted">${money(m.price)}</div></div>
                <div class="qty">
                  <button type="button" data-id="${m.id}" data-d="-1" aria-label="Decrease">−</button>
                  <span>${qty}</span>
                  <button type="button" data-id="${m.id}" data-d="1" aria-label="Increase">+</button>
                </div>
              </div>`;
          })
          .join("");
      }
      updateCartTotal();
    }

    document.getElementById("menu-pick").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-id]");
      if (!b) return;
      const id = Number(b.dataset.id);
      const q = Math.max(0, (cart.get(id) || 0) + Number(b.dataset.d));
      q ? cart.set(id, q) : cart.delete(id);
      renderMenu();
    });

    function cartLines() {
      return [...cart].map(([id, qty]) => {
        const m = menu.find((x) => x.id === id);
        return { id, name: m.name, price: Number(m.price), qty };
      });
    }

    function updateCartTotal() {
      const lines = cartLines();
      const count = lines.reduce((s, l) => s + l.qty, 0);
      document.getElementById("item-count").textContent = `${count} item${count === 1 ? "" : "s"}`;
      document.getElementById("cart-total").textContent = money(lines.reduce((s, l) => s + l.price * l.qty, 0));
    }

    // ---------- Step 3: payment ----------
    function renderPayment() {
      const lines = cartLines();
      const total = lines.reduce((s, l) => s + l.price * l.qty, 0);
      document.getElementById("pay-for").textContent = `${nameIn.value.trim() || "Customer"} · ${phoneIn.value}`;
      document.getElementById("pay-amount").textContent = money(total);
      document.getElementById("pay-items").innerHTML =
        renderItems(lines) + `<li><strong>Total</strong><strong>${money(total)}</strong></li>`;

      const qr = document.getElementById("qr");
      qr.innerHTML = "";
      const upi = `upi://pay?pa=${encodeURIComponent(cfg.UPI_ID)}&pn=${encodeURIComponent(cfg.SHOP_NAME)}&am=${total.toFixed(2)}&cu=INR`;
      if (window.QRCode) {
        new QRCode(qr, { text: upi, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
      } else {
        qr.textContent = "QR unavailable";
      }
    }

    async function submitOrder() {
      nextBtn.disabled = true;
      nextBtn.textContent = "Saving…";
      try {
        const res = await rpc("create_order", {
          p_token: me.token,
          p_phone: phoneIn.value,
          p_customer_name: nameIn.value.trim() || null,
          p_items: [...cart].map(([menu_item_id, qty]) => ({ menu_item_id, qty })),
        });
        cart.clear();
        closeBill();
        toast(`Order #${res.id} saved · ${money(res.total)}`, "success");
      } catch (err) {
        toast(err.message, "error");
        nextBtn.disabled = false;
        nextBtn.textContent = "Done";
      }
    }
  </script>
</body>
</html>
